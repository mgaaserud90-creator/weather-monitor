# ===========================================================================
# commit-generated — the ONE commit transport for this repository.
# ===========================================================================
#
# HISTORICAL NOTE (why this exists)
# ---------------------------------
# There used to be seven hand-rolled copies of this block, plus a legacy
# transport built on a rebase-pull with autostash, the stefanzweifel
# auto-commit action, and a lost-update-proof push option. That legacy
# transport leaves a *conflicted index* behind
# ("_model_quality_log.json: needs merge") whenever a concurrent workflow
# committed the same generated file in between, and the auto-commit action then
# fails while the run still reports green — i.e. the data was lost silently.
# Every writer now goes through this action instead:
#
#   full_auto_pipeline.yml       pipeline job: early commit + final commit
#                                peak-rebuild job
#   model_quality_pipeline.yml   hourly/push
#   collect_resolved_markets.yml
#   fetch_market_prices.yml
#   peak_verify_polymarket.yml
#   live_peak_selector.yml
#
# Do not reintroduce any of those three mechanisms anywhere under .github/.
# They are deliberately not spelled out in this tree, so that a grep guard for
# the three legacy mechanism names stays empty and keeps working as a tripwire.
#
# ===========================================================================
# ARTIFACT OWNERSHIP MAP
# ===========================================================================
# Rule: a workflow stages ONLY artifacts it itself generates. Where an overlap
# is unavoidable it is listed here and is safe only because this action rebases
# with `-X theirs` (freshly regenerated content always wins).
#
#   _model_quality_log.json      full_auto_pipeline (pipeline job: early commit,
#                                final commit; peak-rebuild job)
#                                model_quality_pipeline (hourly/push)
#                                -> 7.5 MB append-only log; both writers are
#                                   full regenerators, ours-wins is correct.
#
#   _resolved_markets_log.json   full_auto_pipeline (pipeline job)
#                                collect_resolved_markets
#   _resolved_markets.csv        collect_resolved_markets
#                                full_auto_pipeline (regenerated from the log
#                                by the same fetcher)
#
#   _quality_report.md           full_auto_pipeline ONLY
#   _quality_report.html         full_auto_pipeline ONLY
#   _all_cities.html             full_auto_pipeline ONLY
#   index.html                   full_auto_pipeline ONLY
#   _recommended_bets.json       full_auto_pipeline ONLY
#   _anbefalt_spill.html         full_auto_pipeline ONLY
#                                ^ collect_resolved_markets used to also stage
#                                  _model_quality_log.json and
#                                  _quality_report.md (E1). It no longer does:
#                                  that workflow never generates reports, so it
#                                  was only ever racing the pipeline for files
#                                  it did not write.
#
#   _market_prices.json          fetch_market_prices ONLY
#   _price_history.jsonl         fetch_market_prices ONLY
#                                -> append-only price panel (P0.4); same single
#                                   writer, so no race with any other job. It is
#                                   budgeted in _check_data_growth.py and
#                                   self-compacts, so it cannot grow forever.
#
#   _peak_verification_log.json  peak_verify_polymarket
#                                full_auto_pipeline (peak-rebuild job)
#   _peak_deviation_log.json     peak_verify_polymarket
#                                full_auto_pipeline (pipeline + peak-rebuild)
#
#   _peak_detection.html         live_peak_selector
#                                full_auto_pipeline (pipeline job)
#
#   _heartbeat.json              full_auto_pipeline (pipeline job) ONLY
#
#   _daily_city_log.json/.csv    full_auto_pipeline ONLY
#   _pnl_log.json                full_auto_pipeline ONLY
#   _edge_enhancer_backtest.json full_auto_pipeline ONLY
#   _modified_*                  full_auto_pipeline ONLY
#   _city_error_diagnostics.*    full_auto_pipeline ONLY
#   _wunderground_real.json/.csv full_auto_pipeline ONLY
# ===========================================================================

name: Commit generated artifacts
description: Rebase-and-retry commit/push for pipeline-generated data files (the single commit transport for every writer).
author: ver-monitor

inputs:
  files:
    description: >-
      Space-separated list of paths to stage. Paths that do not exist in the
      workspace are skipped with a notice (a step timeout can legitimately
      leave a downstream artifact ungenerated).
    required: true
  message_prefix:
    description: >-
      Commit message prefix. " <stamp>" and " (run <run_id>)" are appended, so
      the final message keeps the repo's "Auto: ... (run N)" style.
    required: true
  stamp:
    description: Build stamp, usually `date -u +%Y-%m-%dT%H:%MZ`. Optional.
    required: false
    default: ''

outputs:
  changes_detected:
    description: "'true' when a commit was created, 'false' for a clean no-op."
    value: ${{ steps.commit.outputs.changes_detected }}

runs:
  using: composite
  steps:
    - name: Commit and push generated artifacts
      id: commit
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        MESSAGE_PREFIX: ${{ inputs.message_prefix }}
        STAMP: ${{ inputs.stamp }}
        RUN_ID: ${{ github.run_id }}
        GIT_TERMINAL_PROMPT: '0'
        # Belt and braces: a manual `git commit` needs an identity even when the
        # caller's "Configure git" step was skipped (or a cancelled earlier run).
        GIT_AUTHOR_NAME: github-actions[bot]
        GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: github-actions[bot]
        GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      run: |
        set -uo pipefail

        # Clear any rebase/merge/cherry-pick state left behind by an earlier
        # or cancelled run; git refuses to commit onto a conflicted index.
        git rebase --abort >/dev/null 2>&1 || true
        git merge --abort >/dev/null 2>&1 || true
        git cherry-pick --abort >/dev/null 2>&1 || true
        git reset -q >/dev/null 2>&1 || true   # unstage only, worktree untouched

        for f in $FILES; do
          if [ -f "$f" ]; then
            git add -- "$f"
          else
            echo "::notice::'$f' not present in this workspace — not staged."
          fi
        done

        # No-op path: identical content means the producing step wrote nothing
        # (or its timeout cut it short). Exit 0 so the job stays green, but say
        # so loudly enough to be visible in the log.
        if git diff --cached --quiet; then
          echo "::notice::No generated data changed — nothing to commit."
          echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        MSG="${MESSAGE_PREFIX}"
        if [ -n "${STAMP}" ]; then
          MSG="${MSG} ${STAMP}"
        fi
        MSG="${MSG} (run ${RUN_ID})"
        git commit -m "$MSG"
        echo "changes_detected=true" >> "$GITHUB_OUTPUT"

        # Fetch → rebase → push, retried as a unit. These logs are regenerated
        # in full every run, so on a conflict our fresh content must win
        # (during a rebase `-X theirs` refers to the commit being replayed).
        # Both the rebase and the push can lose a race against a concurrent
        # workflow, so the whole sequence is retried, not just the rebase.
        pushed=0
        for attempt in 1 2 3 4 5; do
          git fetch --quiet origin main || true
          if ! git -c rebase.autoStash=true rebase -X theirs origin/main; then
            echo "::warning::rebase attempt ${attempt} failed, retrying"
            git rebase --abort >/dev/null 2>&1 || true
            sleep 5
            continue
          fi
          if git push origin HEAD:main; then
            pushed=1
            break
          fi
          echo "::warning::push attempt ${attempt} rejected, retrying"
          sleep 5
        done

        if [ "$pushed" = "1" ]; then
          echo "Pushed $(git rev-parse --short HEAD) to main"
        else
          echo "::warning::push failed — the next run will commit this data"
        fi
