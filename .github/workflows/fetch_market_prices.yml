name: Fetch Market Prices

# Cadence: hourly.
#
# This workflow used to run `*/5 * * * *` with `cancel-in-progress: true` and a
# 4-minute job timeout. In practice GitHub throttles cron on public repos
# (observed: 6–8 runs/day, median 4.12 h between runs), so the every-5-minutes
# schedule only produced a queue: each newly queued run cancelled the run that
# was already executing (including its commit step).
#
# Now: a realistic hourly cron that matches what GitHub actually delivers, no
# self-cancelling, and a timeout large enough for checkout + fetch + commit.
# Sub-hour price updates are handled by the separate rapid workflow.
#
# Output: _market_prices.json (committed by the auto-commit step below).

on:
  schedule:
    - cron: '0 * * * *'       # Hourly — matches GitHub's actual delivery rate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-market-prices
  cancel-in-progress: false   # never cancel a run that is mid-commit

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Polymarket prices
        timeout-minutes: 8
        run: |
          set -x
          python3 _fetch_market_prices.py
          echo "Exit code: $?"

      - name: Verify output
        timeout-minutes: 2
        run: |
          if [ -f "_market_prices.json" ]; then
            echo "OK: _market_prices.json ($(wc -c < _market_prices.json) bytes)"
          else
            echo "WARNING: _market_prices.json not generated (API may be rate-limited)"
          fi

      # Single shared commit transport (.github/actions/commit-generated).
      # The old path — rebase-pull with autostash, the auto-commit action, and a
      # forced push — leaves a conflicted index when another workflow committed
      # the same generated file, and the commit then dies silently while the run
      # reports success.
      - name: Commit market prices (always)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        uses: ./.github/actions/commit-generated
        with:
          files: '_market_prices.json'
          message_prefix: 'Auto: market prices'
