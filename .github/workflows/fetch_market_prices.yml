name: Fetch Market Prices

# Base cadence: every 5 minutes — the maximum cron granularity on
# GitHub-hosted runners ('*/5 * * * *').
#
# The optimized `_fetch_market_prices.py` (tag-slug primary + one fallback)
# typically finishes in well under 1 minute, so a 4-minute timeout gives the
# job ample headroom while still guaranteeing it is killed before the next
# cron trigger. Sub-5-minute price updates are handled by the separate
# `fetch_market_prices_rapid.yml` workflow (see that file); this workflow
# remains the baseline/fallback cadence.
#
# Output: _market_prices.json (each commit re-triggers the Pages deploy).

on:
  schedule:
    - cron: '*/5 * * * *'     # Every 5 minutes (cron max)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-market-prices
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Polymarket prices
        run: |
          set -x
          python3 _fetch_market_prices.py
          echo "Exit code: $?"

      - name: Verify output
        run: |
          if [ -f "_market_prices.json" ]; then
            echo "OK: _market_prices.json ($(wc -c < _market_prices.json) bytes)"
          else
            echo "WARNING: _market_prices.json not generated (API may be rate-limited)"
          fi

      - name: Sync before commit
        run: git pull --rebase --autostash origin main || echo "pull failed (continuing)"

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: market prices $(date -u +%Y-%m-%dT%H:%M)"
          file_pattern: '_market_prices.json'
