name: Fetch Market Prices

# Cadence: hourly.
#
# This workflow used to run `*/5 * * * *` with `cancel-in-progress: true` and a
# 4-minute job timeout. In practice GitHub throttles cron on public repos
# (observed: 6–8 runs/day, median 4.12 h between runs), so the every-5-minutes
# schedule only produced a queue: each newly queued run cancelled the run that
# was already executing (including its commit step).
#
# Now: a realistic hourly cron that matches what GitHub actually delivers, no
# self-cancelling, and a timeout large enough for checkout + fetch + commit.
# Sub-hour price updates are handled by the separate rapid workflow.
#
# Output: _market_prices.json (committed by the auto-commit step below).

on:
  schedule:
    - cron: '0 * * * *'       # Hourly — matches GitHub's actual delivery rate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-market-prices
  cancel-in-progress: false   # never cancel a run that is mid-commit

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Polymarket prices
        timeout-minutes: 8
        run: |
          set -x
          python3 _fetch_market_prices.py
          echo "Exit code: $?"

      - name: Verify output
        timeout-minutes: 2
        run: |
          if [ -f "_market_prices.json" ]; then
            echo "OK: _market_prices.json ($(wc -c < _market_prices.json) bytes)"
          else
            echo "WARNING: _market_prices.json not generated (API may be rate-limited)"
          fi

      # Explicit commit: `pull --rebase --autostash` leaves a conflicted index
      # when another workflow committed the same generated file, and the
      # auto-commit action then fails while still reporting success.
      - name: Commit market prices (always)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          FILES: '_market_prices.json'
        run: |
          set -uo pipefail

          git rebase --abort >/dev/null 2>&1 || true
          git merge --abort >/dev/null 2>&1 || true
          git reset -q >/dev/null 2>&1 || true

          for f in $FILES; do
            [ -f "$f" ] && git add -- "$f"
          done

          if git diff --cached --quiet; then
            echo "::notice::Market prices unchanged — nothing to commit."
            exit 0
          fi

          # $(date ...) is not shell context inside an action's "with:" — that is
          # why the old commit messages contained it verbatim. run_id is unique.
          git commit -m "Auto: market prices (run ${RUN_ID})"

          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main || true
            if ! git -c rebase.autoStash=true rebase -X theirs origin/main; then
              echo "::warning::rebase attempt ${attempt} failed, retrying"
              git rebase --abort >/dev/null 2>&1 || true
              sleep 5
              continue
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "::warning::push attempt ${attempt} rejected, retrying"
            sleep 5
          done

          if [ "$pushed" = "1" ]; then
            echo "Pushed $(git rev-parse --short HEAD) to main"
          else
            echo "::warning::push failed — the next run will commit this data"
          fi
