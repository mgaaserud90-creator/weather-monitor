name: Peak Verification vs Polymarket

# Runs after daily_close (23:00 UTC) to compare our archive peaks
# against Polymarket resolved outcomes. Detects station mismatches
# and data source discrepancies.
#
# Uses: _peak_verification_log.json, _model_quality_log.json, _market_prices.json

on:
  schedule:
    - cron: '30 23 * * *'    # 23:30 UTC — 30 min after daily_close starts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: peak-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify peaks vs Polymarket
        run: |
          set -x
          python3 -c "
          import json, sys
          from pathlib import Path
          from datetime import datetime, timezone

          # Load our resolved peaks
          log = json.loads(Path('_model_quality_log.json').read_text())
          runs = log.get('runs', [])
          if not runs:
              print('No runs in quality log — nothing to verify')
              sys.exit(0)

          latest = runs[-1]
          preds = latest.get('predictions', {})
          if not preds:
              print('No predictions in latest run')
              sys.exit(0)

          # Load market resolved outcomes
          market_path = Path('_market_prices.json')
          market_resolved = {}
          if market_path.exists():
              mp = json.loads(market_path.read_text())
              for opp in (mp if isinstance(mp, list) else mp.get('opportunities', [])):
                  outcomes = opp.get('outcomes', [])
                  for o in outcomes:
                      if o.get('price', 0) > 0.99:
                          import re
                          q = opp.get('question', '')
                          m = re.search(r'(\d+)°', q)
                          if m:
                              city = opp.get('city', '')
                              if city:
                                  market_resolved[city] = int(m.group(1))
                              break

          # Compare
          print(f'=== PEAK VERIFICATION ===')
          print(f'Run date: {latest.get(\"run_date\", \"?\")}')
          print(f'Our resolved cities: {sum(1 for p in preds.values() if p.get(\"strategies\",{}).get(\"sigma\",{}).get(\"actual_peak\") is not None)}')
          print(f'Polymarket resolved: {len(market_resolved)}')
          print()

          discrepancies = []
          for city, pdata in sorted(preds.items()):
              strategies = pdata.get('strategies', {})
              sigma = strategies.get('sigma', {})
              our_peak = sigma.get('actual_peak')
              if our_peak is None:
                  continue

              city_base = city.split(',')[0].strip()
              market_temp = market_resolved.get(city) or market_resolved.get(city_base)

              if market_temp is not None:
                  gap = round(our_peak - market_temp, 1)
                  abs_gap = abs(gap)
                  if abs_gap <= 0.5:
                      verdict = '✅ OK'
                  elif abs_gap <= 1.0:
                      verdict = '⚠️ AVVIK'
                  else:
                      verdict = '🔴 KRITISK'
                  print(f'{verdict} {city:<30s} | Vår: {our_peak:.1f}°C | Polymarket: {market_temp}°C | Gap: {gap:+.1f}°C')
                  if abs_gap > 0.5:
                      discrepancies.append({
                          'city': city, 'our_peak': our_peak, 'market_temp': market_temp,
                          'gap': gap, 'verdict': verdict
                      })
              else:
                  print(f'⚪ {city:<30s} | Vår: {our_peak:.1f}°C | Polymarket: (ikke resolved)')

          # Save verification log (compatible format with _generate_quality_report.py)
          now = datetime.now(timezone.utc).isoformat()
          verifications = {}
          for city, pdata in sorted(preds.items()):
              sigma = pdata.get('strategies', {}).get('sigma', {})
              our_peak = sigma.get('actual_peak')
              if our_peak is None:
                  continue
              city_base = city.split(',')[0].strip()
              market_temp = market_resolved.get(city) or market_resolved.get(city_base)
              if market_temp is not None:
                  gap = round(our_peak - market_temp, 1)
                  abs_gap = abs(gap)
                  if abs_gap <= 0.5:
                      verdict = 'OK'
                  elif abs_gap <= 1.0:
                      verdict = 'MINOR'
                  else:
                      verdict = 'STATION_MISMATCH'
                  verifications[city] = {
                      'our_peak': our_peak, 'market_resolved': market_temp,
                      'gap': gap, 'verdict': verdict, 'logged_at': now
                  }
          pv = {'last_updated': now, 'verifications': verifications}
          Path('_peak_verification_log.json').write_text(json.dumps(pv, indent=2, ensure_ascii=False))
          print(f'\\nVerification saved to _peak_verification_log.json ({len(verifications)} cities)')
          "

      - name: Summary
        run: |
          if [ -f "_peak_verification_log.json" ]; then
            echo "=== Verification complete ==="
            python3 -c "
            import json
            pv = json.load(open('_peak_verification_log.json'))
            disc = pv.get('discrepancies', [])
            if disc:
                print(f'WARNING: {len(disc)} discrepancy(s) found (>0.5°C)!')
                for d in disc:
                    print(f'  {d[\"verdict\"]} {d[\"city\"]}: gap={d[\"gap\"]:+.1f}°C')
            else:
                print('All verified peaks match Polymarket within 0.5°C tolerance.')
            "
          else
            echo "No verification data generated."
          fi

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: peak verification vs Polymarket $(date -u +%Y-%m-%dT%H:%M)"
          file_pattern: '_peak_verification_log.json'
