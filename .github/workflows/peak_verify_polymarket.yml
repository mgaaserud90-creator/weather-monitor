name: Peak Verification vs Polymarket

# Runs after daily_close (23:00 UTC) to compare our archive peaks
# against Polymarket resolved outcomes. Detects station mismatches
# and data source discrepancies.
#
# Uses: _peak_verification_log.json, _model_quality_log.json, _market_prices.json

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 min — catches Polymarket resolutions as they happen
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: peak-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Was 5 minutes, while every observed run took 5m18s–5m21s and was always
    # cancelled just before the commit step. The batch API in
    # _model_quality_tracker makes the verification itself take seconds, so the
    # budget is bounded rather than open: step timers sum to
    # 4 + 5 + 1 + 3 + 4 = 17 min, inside this cap.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        timeout-minutes: 4
        continue-on-error: true
        run: pip install httpx structlog tenacity pydantic pydantic-settings python-dotenv orjson redis

      - name: Verify peaks vs Polymarket
        timeout-minutes: 5
        run: |
          set -x
          python3 _populate_peak_verify.py

      - name: Summary
        timeout-minutes: 1
        run: |
          if [ -f "_peak_verification_log.json" ]; then
            echo "=== Verification complete ==="
            echo "Peak verification summary complete."
          else
            echo "No verification data generated."
          fi

      - name: Peak deviation stats (cumulative)
        timeout-minutes: 3
        continue-on-error: true
        run: python3 _peak_deviation_stats.py

      # Single shared commit transport (.github/actions/commit-generated); it
      # also supplies the git identity this workflow has no `git config` step
      # for. Do not reintroduce the legacy rebase-pull-with-autostash or the
      # auto-commit action: these logs are also written by the pipeline, so a
      # concurrent commit makes the pull leave a conflicted index and the commit
      # dies silently.
      - name: Commit verification logs (always)
        if: always()
        timeout-minutes: 4
        continue-on-error: true
        uses: ./.github/actions/commit-generated
        with:
          files: '_peak_verification_log.json _peak_deviation_log.json'
          message_prefix: 'Auto: peak verification vs Polymarket'
