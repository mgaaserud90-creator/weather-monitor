name: Peak Verification vs Polymarket

# Runs after daily_close (23:00 UTC) to compare our archive peaks
# against Polymarket resolved outcomes. Detects station mismatches
# and data source discrepancies.
#
# Uses: _peak_verification_log.json, _model_quality_log.json, _market_prices.json

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 min — catches Polymarket resolutions as they happen
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: peak-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Was 5 minutes, while every observed run took 5m18s–5m21s and was always
    # cancelled just before the commit step. The batch API in
    # _model_quality_tracker makes the verification itself take seconds, but the
    # budget stays generous so checkout/pip/commit/push never get cut.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        timeout-minutes: 8
        continue-on-error: true
        run: pip install httpx structlog tenacity pydantic pydantic-settings python-dotenv orjson redis

      - name: Verify peaks vs Polymarket
        timeout-minutes: 10
        run: |
          set -x
          python3 _populate_peak_verify.py

      - name: Summary
        timeout-minutes: 2
        run: |
          if [ -f "_peak_verification_log.json" ]; then
            echo "=== Verification complete ==="
            echo "Peak verification summary complete."
          else
            echo "No verification data generated."
          fi

      - name: Peak deviation stats (cumulative)
        timeout-minutes: 8
        continue-on-error: true
        run: python3 _peak_deviation_stats.py

      # Explicit commit instead of `pull --rebase --autostash` + auto-commit:
      # those logs are also written by the pipeline, so a concurrent commit
      # makes the pull leave a conflicted index and the commit silently dies.
      - name: Commit verification logs (always)
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          GIT_TERMINAL_PROMPT: '0'
          FILES: '_peak_verification_log.json _peak_deviation_log.json'
        run: |
          set -uo pipefail

          git rebase --abort >/dev/null 2>&1 || true
          git merge --abort >/dev/null 2>&1 || true
          git reset -q >/dev/null 2>&1 || true

          for f in $FILES; do
            [ -f "$f" ] && git add -- "$f"
          done

          if git diff --cached --quiet; then
            echo "::notice::Verification logs unchanged — nothing to commit."
            exit 0
          fi

          # $(date ...) is not shell context inside "with:" of an action — that
          # is why the old commit messages contained it verbatim.
          git commit -m "Auto: peak verification vs Polymarket (run ${RUN_ID})"

          for attempt in 1 2 3; do
            git fetch --quiet origin main || true
            if git -c rebase.autoStash=true rebase -X theirs origin/main; then
              break
            fi
            echo "::warning::rebase attempt ${attempt} failed, retrying"
            git rebase --abort >/dev/null 2>&1 || true
            sleep 5
          done

          if git push origin HEAD:main; then
            echo "Pushed $(git rev-parse --short HEAD) to main"
          else
            echo "::warning::push failed — the next run will commit this data"
          fi
