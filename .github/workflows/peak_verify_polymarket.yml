name: Peak Verification vs Polymarket

# Runs after daily_close (23:00 UTC) to compare our archive peaks
# against Polymarket resolved outcomes. Detects station mismatches
# and data source discrepancies.
#
# Uses: _peak_verification_log.json, _model_quality_log.json, _market_prices.json

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 min — catches Polymarket resolutions as they happen
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: peak-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Was 5 minutes, while every observed run took 5m18s–5m21s and was always
    # cancelled just before the commit step. The batch API in
    # _model_quality_tracker makes the verification itself take seconds, but the
    # budget stays generous so checkout/pip/commit/push never get cut.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        timeout-minutes: 8
        continue-on-error: true
        run: pip install httpx structlog tenacity pydantic pydantic-settings python-dotenv orjson redis

      - name: Verify peaks vs Polymarket
        timeout-minutes: 10
        run: |
          set -x
          python3 _populate_peak_verify.py

      - name: Summary
        timeout-minutes: 2
        run: |
          if [ -f "_peak_verification_log.json" ]; then
            echo "=== Verification complete ==="
            echo "Peak verification summary complete."
          else
            echo "No verification data generated."
          fi

      - name: Peak deviation stats (cumulative)
        timeout-minutes: 8
        continue-on-error: true
        run: python3 _peak_deviation_stats.py

      - name: Sync before commit
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: git -c core.askPass=true pull --rebase --autostash origin main

      - uses: stefanzweifel/git-auto-commit-action@v5
        if: always()
        continue-on-error: true
        with:
          # $(date ...) is not shell context inside "with:" — it was committed
          # literally. github.run_id is always available and unique.
          commit_message: "Auto: peak verification vs Polymarket (run ${{ github.run_id }})"
          file_pattern: '_peak_verification_log.json _peak_deviation_log.json'
          push_options: '--force-with-lease'
