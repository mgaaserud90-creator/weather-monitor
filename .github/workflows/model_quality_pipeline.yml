name: Model Quality Pipeline

# Timezone-aware pipeline — process cities only in their active window.
#
# Two cron triggers:
#   0 * * * *  → hourly_active — Run BMA + peak check for cities in active
#                                 window (04:00 local → peak_end+2 local).
#                                 Different regions are active at different UTC hours.
#   0 23 * * * → daily_close  — Finalize ALL 51 cities at 23:00 UTC (end of UTC day).
#                                 Resolves today's predictions against archive data.
#
# Push to main → trigger deploy_dashboard.yml for GitHub Pages

on:
  push:
    branches: ["main", "master"]
  schedule:
    - cron: '0 * * * *'      # Hourly: timezone-aware active-city processing
    - cron: '0 23 * * *'     # Daily close at 23:00 UTC (ALL cities)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        type: choice
        options: [hourly_active, daily_bma, hourly_check, daily_close, full_report]

permissions:
  contents: write

concurrency:
  group: model-quality-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: github-pages
    # Dynamic timeout:
    #   hourly_active → 300 min (5h, fits GH 6h limit for rapid 3-min polling)
    #   daily_close   → 10 min (processes ALL cities with archive API)
    #   other modes   → 5 min (simple one-shot operations)
    timeout-minutes: ${{ (github.event.schedule == '0 * * * *' && github.event.schedule != '0 23 * * *') && 300 || (github.event.schedule == '0 23 * * *' && 10 || 5) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx structlog tenacity pydantic pydantic-settings python-dotenv orjson redis

      - name: Create minimal .env
        run: |
          cat > .env << 'EOF'
          ENV=production
          WEATHER_BMA_ENABLED=true
          WEATHER_SATELLITE_ENABLED=false
          WEATHER_ENSEMBLE_CONFIDENCE_FLOOR=0.5
          EOF

      - name: Smoke test
        run: |
          python -u -c "import sys; sys.path.insert(0, '.'); from weather_monitor_cli import WeatherAnalyzer, LocationManager; print('Imports OK'); lm = LocationManager(); lm.reset_to_defaults(); print(f'Locations loaded: {lm.count}'); print('Smoke test PASSED')"

      - name: Determine mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(date +%H)
            if [ "$HOUR" = "23" ]; then
              MODE="daily_close"
            else
              MODE="hourly_active"
            fi
          else
            MODE="${{ inputs.mode }}"
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "Running mode: $MODE at UTC $(date -u +%H:%M)"

      - name: Fetch market prices
        run: python _fetch_market_prices.py

      - name: Run tracker
        run: |
          set -x
          python -u _model_quality_tracker.py --mode ${{ steps.mode.outputs.mode }}

      - name: Generate Dashboard HTML
        run: python _generate_quality_report.py --html

      - name: Generate All-Cities HTML
        run: python _generate_quality_report.py --all-cities

      - name: Verify data
        run: |
          set -x
          echo "=== Verifying generated files ==="
          for f in _model_quality_log.json _quality_report.md _quality_report.html _all_cities.html; do
            if [ -f "$f" ]; then
              echo "OK: $f ($(wc -c < "$f") bytes)"
            else
              echo "MISSING: $f"
            fi
          done
          python -c "
          import json
          d = json.load(open('_model_quality_log.json'))
          print(f'Runs in log: {len(d.get(\"runs\", d if isinstance(d, list) else []))}')
          "

      - name: Send SMS alerts
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
        run: python _sms_alert.py --check-and-send

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: ${{ steps.mode.outputs.mode }} $(date -Iminutes)"
          file_pattern: '_model_quality_log.json _quality_report.md _quality_report.html _all_cities.html _rapid_peak_log.json _market_prices.json _sms_log.json'
