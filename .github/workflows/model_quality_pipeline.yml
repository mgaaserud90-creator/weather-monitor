name: Model Quality Pipeline

# Hourly prediction generator. Runs timezone-aware `hourly_active` once per hour
# so every city gets fresh BMA predictions as soon as it enters its active
# window (04:00 local → peak_end+2).
#
# Daily resolution (daily_close), backfill, Wunderground real-resolution fetch,
# peak history/verification/stats, diagnostics, daily city log, PnL ledger,
# edge enhancer, report generation and data verification all live in
# `full_auto_pipeline.yml` (Asia/Europe/Americas staggered UTC crons).

on:
  push:
    branches: ["main", "master"]
  schedule:
    - cron: '0 0-22 * * *'    # Hourly (00:00-22:00 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        type: choice
        options: [hourly_active, hourly_check]

permissions:
  contents: write

concurrency:
  group: model-quality-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx structlog tenacity pydantic pydantic-settings python-dotenv orjson redis

      - name: Create minimal .env
        run: |
          cat > .env << 'EOF'
          ENV=production
          WEATHER_BMA_ENABLED=true
          WEATHER_SATELLITE_ENABLED=false
          WEATHER_ENSEMBLE_CONFIDENCE_FLOOR=0.5
          EOF

      - name: Run hourly active
        run: |
          set -x
          python3 _model_quality_tracker.py --mode hourly_active

      - name: Sync before commit
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: git -c core.askPass=true pull --rebase --autostash origin main

      - uses: stefanzweifel/git-auto-commit-action@v5
        continue-on-error: true
        with:
          commit_message: "Auto: hourly active $(date -u +%Y-%m-%dT%H:%M)"
          file_pattern: '_model_quality_log.json'
          push_options: '--force-with-lease'
