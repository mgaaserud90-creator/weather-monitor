name: Model Quality Pipeline

# Lightweight pipeline — minimal API calls.
#
# Two cron triggers:
#   0 * * * *       → hourly_active  — Simple BMA + peak check once per hour.
#                                      No rapid monitoring. ~50 API calls per run.
#   0 23 * * *      → daily_close    — Resolve today's predictions against archive data.
#
# Push to main → trigger deploy_dashboard.yml for GitHub Pages

on:
  push:
    branches: ["main", "master"]
  schedule:
    - cron: '0 0-22 * * *'    # Hourly (00:00-22:00 UTC): simple BMA + peak check
    - cron: '0 23 * * *'      # Daily close at 23:00 UTC (NO hourly at 23:00 to avoid conflict)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        type: choice
        options: [hourly_active, daily_bma, hourly_check, daily_close, full_report]

permissions:
  contents: write
  actions: write

concurrency:
  group: model-quality-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Hourly: 10 min (simple BMA + peak check)
    # Daily close: 10 min (archive API)
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx structlog tenacity pydantic pydantic-settings python-dotenv orjson redis

      - name: Create minimal .env
        run: |
          cat > .env << 'EOF'
          ENV=production
          WEATHER_BMA_ENABLED=true
          WEATHER_SATELLITE_ENABLED=false
          WEATHER_ENSEMBLE_CONFIDENCE_FLOOR=0.5
          EOF

      - name: Smoke test
        run: |
          python -u -c "import sys; sys.path.insert(0, '.'); from weather_monitor_cli import WeatherAnalyzer, LocationManager; print('Imports OK'); lm = LocationManager(); lm.reset_to_defaults(); print(f'Locations loaded: {lm.count}'); print('Smoke test PASSED')"

      - name: Determine mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(date +%H)
            if [ "$HOUR" = "23" ]; then
              MODE="daily_close"
            else
              MODE="hourly_active"
            fi
          else
            MODE="${{ inputs.mode }}"
            if [ -z "$MODE" ]; then
              MODE="hourly_active"
              echo "No mode provided, defaulting to hourly_active"
            fi
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "Running mode: $MODE at UTC $(date -u +%H:%M) (schedule: ${SCHEDULE:-manual})"

      - name: Run tracker
        run: |
          set -x
          python -u _model_quality_tracker.py --mode ${{ steps.mode.outputs.mode }}

      - name: Generate Dashboard HTML
        run: python _generate_quality_report.py --html

      - name: Generate All-Cities HTML
        run: python _generate_quality_report.py --all-cities

      - name: Consolidate trading data
        run: python3 _consolidate_trading_data.py

      - name: Track model accuracy
        run: python3 _model_accuracy_tracker.py

      - name: Verify all data integrity
        run: python3 _verify_all_data.py

      - name: Verify output files
        run: |
          set -x
          echo "=== Verifying generated files ==="
          for f in _model_quality_log.json _quality_report.md _quality_report.html _all_cities.html; do
            if [ -f "$f" ]; then
              echo "OK: $f ($(wc -c < "$f") bytes)"
            else
              echo "MISSING: $f"
            fi
          done
          python -c "
          import json
          d = json.load(open('_model_quality_log.json'))
          print(f'Runs in log: {len(d.get(\"runs\", d if isinstance(d, list) else []))}')
          "

      - name: Send SMS alerts
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
        run: python _sms_alert.py --check-and-send

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: ${{ steps.mode.outputs.mode }} $(date -Iminutes)"
          file_pattern: '_model_quality_log.json _quality_report.md _quality_report.html _all_cities.html _market_prices.json _trading_data.csv _strategy_summary.csv _model_accuracy_log.json _model_accuracy.csv'
          push_options: '--force-with-lease'

      - name: Trigger deploy to GitHub Pages
        if: success()
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy_dashboard.yml/dispatches" \
            -d '{"ref":"main"}'
