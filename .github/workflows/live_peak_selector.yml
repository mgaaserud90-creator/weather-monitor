name: Live Peak Auto-Selector

# Runs every 5 minutes. ZERO weather API calls — only timezone math.
# Detects which cities are in their peak window and generates
# _peak_detection.html with those cities auto-selected.
#
# Browser JS handles actual temperature fetching (user's IP = separate rate limit).

on:
  schedule:
    - cron: '*/5 * * * *'     # Every 5 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-peak-selector
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    # Step timers sum to 1 + 3 + 1 + 4 = 9 min, inside this cap. The commit
    # step used to carry 10 min under a 3 min job, i.e. it could never run to
    # completion and the run was cancelled mid-push.
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify prerequisites
        timeout-minutes: 1
        run: |
          echo "=== Checking prerequisites ==="
          python3 --version
          echo "Files in workspace:"
          ls -la _generate_quality_report.py weather_monitor_defaults.json 2>/dev/null || echo "WARNING: Some files missing"
          if [ ! -f "weather_monitor_defaults.json" ]; then
            echo "ERROR: weather_monitor_defaults.json is required"
            exit 1
          fi

      - name: Generate peak detection page
        timeout-minutes: 3
        run: |
          set -x
          python3 _generate_quality_report.py --peak
          echo "Exit code: $?"

      - name: Verify output
        timeout-minutes: 1
        run: |
          if [ -f "_peak_detection.html" ]; then
            AUTO_COUNT=$(grep -c '"AUTO_SELECT_CITIES"' _peak_detection.html || echo 0)
            echo "OK: _peak_detection.html ($(wc -c < _peak_detection.html) bytes, auto-select line found: $AUTO_COUNT)"
            head -c 500 _peak_detection.html
          else
            echo "ERROR: _peak_detection.html not generated"
            exit 1
          fi

      # Single shared commit transport (.github/actions/commit-generated).
      # The legacy rebase-pull-with-autostash plus auto-commit plus forced-push
      # combination is banned in this repository (see the action's header).
      - name: Commit peak detection page (always)
        if: always()
        timeout-minutes: 4
        continue-on-error: true
        uses: ./.github/actions/commit-generated
        with:
          files: '_peak_detection.html'
          message_prefix: 'Auto: live peak selector'
