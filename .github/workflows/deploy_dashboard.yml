# Deploy Model Quality Dashboard to GitHub Pages
# Trigger: push to main branch + manual dispatch
# Carnivore pattern: build → upload artifact → deploy pages
name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx structlog tenacity pydantic pydantic-settings python-dotenv orjson redis

      - name: Create minimal .env
        run: |
          cat > .env << 'EOF'
          ENV=production
          WEATHER_BMA_ENABLED=true
          WEATHER_SATELLITE_ENABLED=false
          WEATHER_ENSEMBLE_CONFIDENCE_FLOOR=0.5
          EOF

      - name: Generate HTML Dashboard
        run: python _generate_quality_report.py --html

      - name: Generate All-Cities HTML
        run: python _generate_quality_report.py --all-cities

      - name: Generate index
        run: python _generate_quality_report.py --index

      - name: Generate peak detection
        run: python _generate_quality_report.py --peak

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
