name: Full Auto Pipeline (v1)

# The single comprehensive daily pipeline. Runs in the exact order the data
# dependency graph requires and is idempotent, so it can be triggered repeatedly.
#
# Cron schedule (all UTC):
#   30 16 * * *  → Asia daily close    (16:30 UTC = 00:30 Asia/Taipei next day)
#   30 0  * * *  → Europe daily close  (00:30 UTC = 02:30 Europe/Paris next day)
#   30 8  * * *  → Americas daily close(08:30 UTC = 04:30 America/New_York next day)
#   0  12 * * *  → Backstop full run   (12:00 UTC — catch-all + daily_bma refresh)
#
# SCHEDULE GATES (C1/C2) — do not reintroduce a wall-clock hour check.
# GitHub delivers these crons 3–7 hours late (measured 2026-10-29: not one run
# in its intended hour; the 08:30 slot had still not fired at 11:12Z). Gating
# on the current UTC hour therefore made the Asia close branch and the daily_bma
# refresh take 0.0 s on every run while still reporting `success` — daily_bma
# never ran on the daily path at all. The region is now dispatched from
# `github.event.schedule`, which is the cron expression that actually fired and
# is immune to delivery delay. Anything unrecognised fails loudly instead of
# silently skipping; `force_schedule` lets a dispatch exercise the mapping.
#
# Job layout (robustness):
#   pipeline      a. fetch predictions + daily close for the region that closed
#                 b. resolved markets + strategy backfill
#                 c. Wunderground real daily max
#                 d. derived stats / diagnostics / logs
#                 e. reports → commit (always)
#   peak-rebuild  Separate, non-critical job: rebuilds historical peak data.
#                 It used to sit in the critical path and burned the whole job
#                 budget (55 min of a 60 min job), which killed every remaining
#                 step including the commit and the deploy. It is now its own
#                 job with its own bounded steps, and it is incremental.
#   deploy        Real Pages deployment as a job in THIS workflow. Pushes made
#                 with GITHUB_TOKEN never trigger other workflows (GitHub's
#                 recursion guard), so deploy_dashboard.yml could not be relied
#                 on to run after the auto-commit. A job needs no trigger.
#
# TIMEOUT BUDGET (A3). `timeout-minutes` is a hang detector, not a duration
# estimate, and ~29 independent timers cannot all be generous under a bounded
# job. The rule enforced by `_check_timeout_budget.py` is arithmetic, not taste:
#
#     sum(per-step timeout-minutes) <= job timeout-minutes
#
# so no hung step can consume the budget a later step — above all the commit —
# still needs. Before this pass the pipeline's per-step timeouts summed to
# ~328 min under a 90 min job: every timer was decorative and the job cap was
# what actually killed the 2026-10-27 run before its commit step. Current
# arithmetic for `pipeline` under a 60 min job: install 5 + predictions 10
# (measured 2 m 38 s) + daily_bma 10 (measured 3 m 27 s, do not go below 10) +
# daily close 5 + early commit 8 + resolved markets 5 + backfill 3 +
# Wunderground 5 + final commit 8 = 59. Steps that are pure local Python over
# local JSON (report generators, derived logs) deliberately carry no timer:
# they are bounded by the job cap AND they all run after the early commit, so a
# hang there cannot lose the day's core output.

on:
  schedule:
    - cron: '30 16 * * *'   # Asia daily close
    - cron: '30 0 * * *'    # Europe daily close
    - cron: '30 8 * * *'    # Americas daily close
    - cron: '0 12 * * *'    # Backstop full run
  workflow_dispatch:
    inputs:
      force_schedule:
        description: >-
          Cron expression to force instead of github.event.schedule, e.g.
          "0 12 * * *" or "30 16 * * *". Testing aid for the region mapping.
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: full-auto-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    name: Data pipeline
    runs-on: ubuntu-latest
    # Hard cap. The per-step timers below must SUM to no more than this
    # (enforced by _check_timeout_budget.py), so no single step can starve the
    # commit steps that follow it. One full run measures ~10 min.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        timeout-minutes: 5
        continue-on-error: true
        run: pip install httpx structlog tenacity pydantic pydantic-settings python-dotenv orjson redis

      - name: Create minimal .env
        run: |
          cat > .env << 'EOF'
          ENV=production
          WEATHER_BMA_ENABLED=true
          WEATHER_SATELLITE_ENABLED=false
          WEATHER_ENSEMBLE_CONFIDENCE_FLOOR=0.5
          EOF

      # commit_message is not a shell context, so the old
      # "$(date -u +%Y-%m-%dT%H:%M)" was committed literally. Precompute it.
      - name: Compute build stamp
        id: stamp
        shell: bash
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"

      - name: Determine region close date
        id: close_date
        shell: bash
        env:
          FORCE_SCHEDULE: ${{ inputs.force_schedule }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Dispatch on the cron expression that actually fired. Never on the
          # wall clock: GitHub delivers these crons 3-7 h late, so an hour check
          # silently skipped the Asia branch and daily_bma on every run.
          SCHED="${FORCE_SCHEDULE:-${EVENT_SCHEDULE:-}}"

          case "$SCHED" in
            '30 16 * * *')   # Asia close: today's entry resolves today
              REGION=asia
              CLOSE_DATE=$(date -u +%F)
              ;;
            '30 0 * * *')    # Europe close
              REGION=europe
              CLOSE_DATE=$(date -u -d 'yesterday' +%F)
              ;;
            '30 8 * * *')    # Americas close
              REGION=americas
              CLOSE_DATE=$(date -u -d 'yesterday' +%F)
              ;;
            '0 12 * * *')    # Backstop full run (owns daily_bma)
              REGION=backstop
              CLOSE_DATE=$(date -u -d 'yesterday' +%F)
              ;;
            *)
              echo "::error::Unrecognised schedule '${SCHED}' — refusing to guess a region. Use workflow_dispatch with force_schedule set to one of the four crons."
              exit 1
              ;;
          esac

          echo "region=$REGION" >> "$GITHUB_OUTPUT"
          echo "close_date=$CLOSE_DATE" >> "$GITHUB_OUTPUT"
          echo "schedule='${SCHED}' → region=${REGION} close_date=${CLOSE_DATE}"

      # ---- a. fetch predictions + daily close --------------------------------
      - name: Fetch predictions (hourly active)
        timeout-minutes: 10
        run: python3 _model_quality_tracker.py --mode hourly_active

      # Gated on the dispatched region, not on the wall clock (C2). Under the
      # old "current UTC hour == 12" test this step ran 0.0 s on all five most
      # recent pipeline runs and reported success while echoing a skip message.
      # daily_bma legitimately takes 3 m 27 s (it is no longer skipped). 10 min
      # is the floor: do not squeeze it below that.
      - name: Daily BMA refresh (backstop schedule only)
        if: steps.close_date.outputs.region == 'backstop'
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        run: python3 _model_quality_tracker.py --mode daily_bma

      - name: Daily BMA not scheduled for this region
        if: steps.close_date.outputs.region != 'backstop'
        shell: bash
        run: |
          echo "Skip daily_bma (region=${{ steps.close_date.outputs.region }}, not the 0 12 * * * backstop run)"

      - name: Run daily close (region)
        timeout-minutes: 5
        run: python3 _model_quality_tracker.py --mode daily_close --date "${{ steps.close_date.outputs.close_date }}"

      # A2 — commit the primary artifacts as soon as they exist.
      # `if: always()` does NOT survive a JOB-level timeout kill, which is
      # exactly the 2026-10-27 mechanism. With the timeout budget now additive
      # (step sums <= the job cap) the final commit is reachable, but the early
      # commit still bounds the loss to the derived reports if anything below
      # misbehaves.
      - name: Commit core artifacts (early)
        if: always()
        timeout-minutes: 8
        continue-on-error: true
        uses: ./.github/actions/commit-generated
        with:
          files: _model_quality_log.json _resolved_markets_log.json _resolved_markets.csv
          message_prefix: 'Auto: full pipeline (core artifacts)'
          stamp: ${{ steps.stamp.outputs.iso }}

      # ---- b. resolved markets + backfill ------------------------------------
      - name: Fetch resolved markets (rolling 7 days)
        timeout-minutes: 5
        continue-on-error: true
        run: |
          DATES=$(python3 -c "
          from datetime import date, timedelta
          today = date.today()
          print(' '.join((today - timedelta(days=i)).isoformat() for i in range(7)))
          ")
          echo "Fetching dates: $DATES"
          python3 _fetch_resolved_markets.py --dates $DATES

      - name: Backfill strategy resolutions
        timeout-minutes: 3
        continue-on-error: true
        run: python3 _model_quality_tracker.py --mode backfill

      # ---- c. Wunderground real resolutions -----------------------------------
      # D5: the fetcher now exits non-zero when a run produced no successes at
      # all. `continue-on-error` is kept so the derived reports and both commits
      # still execute (the pipeline must stay resilient), and the failure is
      # made LOUD by the summary step below, which names the succeeded vs
      # failed city-day counts and emits ::warning:: / ::error:: instead of
      # letting a null-filled artifact look green.
      - name: Fetch Wunderground real resolutions
        id: wu
        timeout-minutes: 5
        continue-on-error: true
        run: python3 _fetch_wunderground_real.py

      - name: Wunderground fetch summary (loud failure)
        if: always()
        env:
          WU_OUTCOME: ${{ steps.wu.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("_wunderground_real.json")
          if not path.exists():
              print("::error::_wunderground_real.json is missing - the fetch wrote nothing.")
              sys.exit(0)
          data = json.loads(path.read_text(encoding="utf-8"))
          cities = data.get("cities", {})
          latest = max(
              (r.get("date") for c in cities.values() for r in c.get("rows", [])),
              default=None,
          )
          if not latest:
              print("::error::_wunderground_real.json holds no rows at all.")
              sys.exit(0)
          ok = fail = 0
          for c in cities.values():
              for r in c.get("rows", []):
                  if r.get("date") != latest:
                      continue
                  if r.get("wu_real_max") is not None and r.get("status") == 200:
                      ok += 1
                  else:
                      fail += 1
          print(f"Wunderground {latest}: {ok} city-days succeeded, {fail} failed")
          if fail:
              print(
                  f"::warning::Wunderground {latest}: {ok} succeeded / {fail} failed "
                  f"city-days (failed dates are retried on the next run)"
              )
          if ok == 0:
              print(
                  f"::error::Wunderground {latest}: total failure - 0 of {fail} "
                  f"city-days returned a reading."
              )
          PY
          if [ "$WU_OUTCOME" != "success" ]; then
            echo "::warning::The Wunderground fetch step reported outcome '$WU_OUTCOME' - see the counts above."
          fi

      # ---- d. derived stats / diagnostics / logs ------------------------------
      # "Rebuild peak history" moved to the peak-rebuild job below.
      - name: Populate peak verification
        continue-on-error: true
        run: python3 _populate_peak_verify.py

      - name: Peak deviation stats
        continue-on-error: true
        run: python3 _peak_deviation_stats.py

      - name: City error diagnostics
        continue-on-error: true
        run: python3 _diagnose_city_errors.py

      - name: Generate modified strategy (full backfill + today)
        run: python3 _modified_strategy.py

      - name: Modifisert confidence research
        continue-on-error: true
        run: python3 _modified_research.py --json > _modified_confidence_report.json

      - name: Daily city log
        continue-on-error: true
        run: python3 _daily_city_log.py

      - name: PnL ledger
        continue-on-error: true
        run: python3 _pnl_tracker.py

      - name: Edge enhancer backtest
        continue-on-error: true
        run: python3 _edge_enhancer.py

      # ---- e. reports + verification ------------------------------------------
      - name: Generate full report (tracker)
        continue-on-error: true
        run: python3 _model_quality_tracker.py --mode full_report

      - name: Generate MD report
        continue-on-error: true
        run: python3 _generate_quality_report.py

      - name: Generate HTML dashboard
        continue-on-error: true
        run: python3 _generate_quality_report.py --html

      - name: Generate all-cities HTML
        continue-on-error: true
        run: python3 _generate_quality_report.py --all-cities

      - name: Generate index
        continue-on-error: true
        run: python3 _generate_quality_report.py --index

      - name: Generate peak detection page
        continue-on-error: true
        run: python3 _generate_quality_report.py --peak

      - name: Generate recommended bets (Anbefalt spill)
        continue-on-error: true
        run: python3 _recommended_bets.py

      - name: Verify all data integrity
        continue-on-error: true
        run: python3 _verify_all_data.py

      # ---- heartbeat (B1): penultimate step, before the final commit ----------
      # Every historical failure mode here was silent: a job-level kill removes
      # the steps that would have reported anything. This writes a tiny
      # `_heartbeat.json` ("a run reached its final steps, here is what the
      # artifacts looked like"), atomically, using stat-only reads, and the SLA
      # watchdog treats a missing or stale one as a failure in its own right.
      - name: Write heartbeat
        if: always()
        continue-on-error: true
        env:
          REGION: ${{ steps.close_date.outputs.region }}
        run: python3 _heartbeat.py --mode "pipeline${REGION:+/$REGION}"

      # ---- commit (always: never lose derived data because a step was slow) ---
      # One shared transport (.github/actions/commit-generated) instead of seven
      # hand-rolled copies. Do NOT go back to the auto-commit action or the
      # rebase-pull-with-autostash pattern: that pair leaves a *conflicted index*
      # behind ("_model_quality_log.json: needs merge") whenever a concurrent
      # workflow committed the same generated log in the meantime, which
      # silently killed the commit while the deploy still reported success.
      - name: Commit derived data (always)
        id: commit
        if: always()
        timeout-minutes: 8
        continue-on-error: true
        uses: ./.github/actions/commit-generated
        with:
          files: >-
            _model_quality_log.json _resolved_markets_log.json _resolved_markets.csv
            _wunderground_real.json _wunderground_real.csv
            _peak_verification_log.json _peak_deviation_log.json
            _city_error_diagnostics.json _city_error_diagnostics.csv
            _daily_city_log.json _daily_city_log.csv
            _pnl_log.json _edge_enhancer_backtest.json
            _quality_report.md _quality_report.html _all_cities.html
            index.html _peak_detection.html
            _modified_strategy_log.json _modified_strategy_report.html
            _modified_bets_log.json _modified_confidence_report.json
            _recommended_bets.json _anbefalt_spill.html
            _heartbeat.json
          message_prefix: 'Auto: full pipeline'
          stamp: ${{ steps.stamp.outputs.iso }}

  # ---------------------------------------------------------------------------
  # Non-critical history rebuild. Isolated so a slow archive API can never eat
  # the pipeline budget again. Incremental: costs seconds when nothing is new.
  # ---------------------------------------------------------------------------
  peak-rebuild:
    name: Peak history rebuild (non-critical)
    needs: pipeline
    if: always()
    runs-on: ubuntu-latest
    # Step timers sum to 5 + 8 + 4 + 6 = 23 min, under this cap
    # (was 50 min of timers under a 30 min job).
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        timeout-minutes: 5
        continue-on-error: true
        run: pip install httpx structlog tenacity pydantic pydantic-settings python-dotenv orjson redis

      - name: Compute build stamp
        id: stamp
        shell: bash
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"

      - name: Rebuild peak history (incremental)
        timeout-minutes: 8
        continue-on-error: true
        run: python3 _rebuild_peak_history.py

      - name: Peak deviation stats
        timeout-minutes: 4
        continue-on-error: true
        run: python3 _peak_deviation_stats.py

      # Same single commit transport as the data job (see
      # .github/actions/commit-generated): no rebase-pull with autostash, which
      # leaves a conflicted index when a concurrent workflow touched the same
      # generated log.
      - name: Commit peak history (always)
        id: commit
        if: always()
        timeout-minutes: 6
        continue-on-error: true
        uses: ./.github/actions/commit-generated
        with:
          files: >-
            _model_quality_log.json _peak_verification_log.json
            _peak_deviation_log.json
          message_prefix: 'Auto: peak history rebuild'
          stamp: ${{ steps.stamp.outputs.iso }}

  # ---------------------------------------------------------------------------
  # Real Pages deployment, as a job. Works even though the auto-commit above was
  # pushed with GITHUB_TOKEN (which never triggers other workflows).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy dashboard to GitHub Pages
    needs: [pipeline, peak-rebuild]
    if: always()
    runs-on: ubuntu-latest
    # Step timers sum to 5 + 1 + 4 + 4 + 4 + 4 + 4 = 26 min, under this cap
    # (was ~63-72 min of timers under a 25 min job).
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        timeout-minutes: 5
        continue-on-error: true
        run: pip install httpx structlog tenacity pydantic pydantic-settings python-dotenv orjson redis

      - name: Create minimal .env
        timeout-minutes: 1
        run: |
          cat > .env << 'EOF'
          ENV=production
          WEATHER_BMA_ENABLED=true
          WEATHER_SATELLITE_ENABLED=false
          WEATHER_ENSEMBLE_CONFIDENCE_FLOOR=0.5
          EOF

      - name: Generate HTML dashboard
        timeout-minutes: 4
        continue-on-error: true
        run: python _generate_quality_report.py --html

      - name: Generate all-cities HTML
        timeout-minutes: 4
        continue-on-error: true
        run: python _generate_quality_report.py --all-cities

      - name: Generate index
        timeout-minutes: 4
        continue-on-error: true
        run: python _generate_quality_report.py --index

      - name: Generate peak detection page
        timeout-minutes: 4
        continue-on-error: true
        run: python _generate_quality_report.py --peak

      - name: Generate recommended bets (Anbefalt spill)
        timeout-minutes: 4
        continue-on-error: true
        run: python _recommended_bets.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
