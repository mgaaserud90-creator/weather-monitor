name: Fetch Market Prices (Rapid)

# Sub-5-minute price updates.
#
# A single job runs a poll loop for up to 350 minutes (~5h50m), fetching and
# committing _market_prices.json every 2 minutes. Each commit re-triggers the
# Pages dashboard deploy, so the dashboard sees price updates roughly every
# 2 minutes while this job is active.
#
# Keep-alive: `schedule` starts a fresh rapid window every 3 hours. Because a
# window lasts ~5h50m, a newly triggered run queues behind the running one
# (concurrency group `fetch-market-prices-rapid`, cancel-in-progress: false)
# and starts as soon as it finishes — near-continuous coverage without two
# rapid jobs running at once and without exceeding GitHub's 6-hour per-job
# limit. The loop self-terminates at the runtime cap.
#
# `workflow_dispatch` starts a manual rapid window on demand. The base
# `fetch_market_prices.yml` workflow remains the '*/5 * * * *' fallback.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'    # start a fresh rapid window every 3 hours

permissions:
  contents: write

concurrency:
  group: fetch-market-prices-rapid
  cancel-in-progress: false

jobs:
  rapid:
    runs-on: ubuntu-latest
    timeout-minutes: 360      # hard 6-hour ceiling; loop self-terminates at ~5h50m

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rapid price poll loop
        run: |
          set -uo pipefail
          POLL_INTERVAL_SEC=120
          MAX_RUNTIME_SEC=$((5 * 3600 + 50 * 60))   # 350 min < 360 min job limit
          END_EPOCH=$(( $(date +%s) + MAX_RUNTIME_SEC ))
          poll=0
          echo "Rapid window: every ${POLL_INTERVAL_SEC}s for up to ${MAX_RUNTIME_SEC}s"

          while [ "$(date +%s)" -lt "$END_EPOCH" ]; do
            poll=$((poll + 1))
            echo "===== rapid poll #${poll} @ $(date -u +%Y-%m-%dT%H:%M:%SZ) ====="

            # Start every poll from the latest remote main so we never rebase
            # or conflict with the base cron workflow. A lost push race simply
            # retries on the next poll.
            git fetch origin main || echo "fetch failed (using stale origin/main)"
            git checkout -B rapid-pricing origin/main || { echo "checkout failed; retrying next poll"; sleep "$POLL_INTERVAL_SEC"; continue; }

            if python3 _fetch_market_prices.py; then
              git add _market_prices.json
              if ! git diff --cached --quiet; then
                git commit -m "Auto: rapid market prices $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                git push origin HEAD:main || echo "push failed (retry next poll)"
              else
                echo "No price changes this poll"
              fi
            else
              echo "Fetch failed this poll (continuing)"
            fi

            remaining=$(( END_EPOCH - $(date +%s) ))
            [ "$remaining" -le 0 ] && break
            sleep_sec=$POLL_INTERVAL_SEC
            [ "$sleep_sec" -gt "$remaining" ] && sleep_sec=$remaining
            sleep "$sleep_sec"
          done

          echo "Rapid window complete after ${poll} poll(s)"
