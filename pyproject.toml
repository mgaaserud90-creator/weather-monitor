[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-arb-bot"
version = "1.0.0"
description = "Polymarket Arbitrage Trading Bot — Real-time cross-market and cross-platform arbitrage"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Arb Bot Team" }
]
keywords = ["polymarket", "arbitrage", "trading", "defi", "crypto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # CLOB Client
    "py-clob-client-v2>=0.3.0",

    # Async HTTP
    "httpx>=0.27.0",

    # WebSocket
    "websockets>=13.0",

    # Redis
    "redis>=5.0.0,<6.0.0",
    "hiredis>=2.3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",

    # Data processing
    "polars>=1.0.0",

    # Configuration & Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Structured logging
    "structlog>=24.0.0",
    "orjson>=3.10.0",

    # Monitoring
    "prometheus-client>=0.20.0",

    # Optimization / Integer Programming
    "pulp>=2.8.0",

    # Retry logic
    "tenacity>=8.3.0",

    # FastAPI for admin API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",

    # Blockchain interaction
    "web3>=6.19.0",

    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-redis>=4.6.0",
    "types-orjson>=3.6.0",
    "httpx-ws>=0.5.0",  # For testing WebSocket
]
gui = [
    "nicegui>=1.4.0",
    "plotly>=5.18.0",
]

[project.scripts]
polymarket-gui = "src.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "py_clob_client.*",
    "pulp.*",
    "orjson.*",
    "hiredis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]
